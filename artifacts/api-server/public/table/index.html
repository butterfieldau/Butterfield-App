<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order at the Table — Butterfield Cookies</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      background: #fdf8f3;
      color: #1a1a1a;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .card {
      background: #fff;
      border-radius: 1rem;
      padding: 2rem;
      max-width: 28rem;
      width: 100%;
      text-align: center;
      box-shadow: 0 2px 16px rgba(0,0,0,0.08);
    }
    h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
    p  { color: #666; line-height: 1.5; }
    .loader {
      width: 2rem; height: 2rem;
      border: 3px solid #f0e8de;
      border-top-color: #c97b4a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 1.5rem auto 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <h1>🍪 Butterfield Cookies</h1>
    <p>Loading your table ordering experience…</p>
    <div class="loader"></div>
  </div>

  <!--
    Table config injected server-side as:
    <script id="table-config" type="application/json">{"storeId":"...","tableNumber":"..."}</script>

    The SPA bundle (built by the web-app task) reads it on load:
      const cfg = JSON.parse(document.getElementById('table-config').textContent);
  -->
</body>
</html>
